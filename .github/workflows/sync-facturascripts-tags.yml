name: Sync FacturaScripts Releases

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-facturascripts-tags.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: sync-facturascripts-releases
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      builds: ${{ steps.discover.outputs.builds }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Discover unpublished FacturaScripts builds
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          get_channel_version() {
            local channel="$1" headers version
            headers=$(curl --fail --silent --show-error --location --head \
              "https://facturascripts.com/DownloadBuild/1/${channel}")
            version=$(sed -nE 's/.*filename="?CORE-([0-9]{4}(\.[0-9]+)?)\.zip"?.*/\1/ip' \
              <<< "$headers" | tail -1)
            [[ "$version" =~ ^[0-9]{4}(\.[0-9]+)?$ ]] || {
              echo "Could not detect the ${channel} version" >&2
              exit 1
            }
            printf '%s' "$version"
          }

          stable=$(get_channel_version stable)
          beta=$(get_channel_version beta)
          docker_tags=$(curl --fail --silent --show-error \
            "https://hub.docker.com/v2/repositories/${DOCKER_REPOSITORY}/tags?page_size=100")
          releases=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/NeoRazorX/facturascripts/releases?per_page=100')

          # Keep a bounded repair window: the five newest upstream releases plus
          # the official channels. This retries recent partial failures without
          # rebuilding the entire historical catalogue after registry cleanup.
          candidates=()
          while IFS= read -r tag; do
            candidates+=("${tag#v}")
          done < <(jq -r \
            '[.[] | select(any(.assets[]?; .name == "CORE.zip"))][0:5][] | .tag_name' \
            <<< "$releases")
          candidates+=("$stable" "$beta")

          builds='[]'
          seen=' '
          for version in "${candidates[@]}"; do
            [[ "$version" =~ ^[0-9]{4}(\.[0-9]+)?$ ]] || continue
            [[ "$seen" == *" $version "* ]] && continue
            seen+="$version "

            channel=version
            if [[ "$version" == "$stable" && "$version" == "$beta" ]]; then
              channel='stable-beta'
            elif [[ "$version" == "$stable" ]]; then
              channel=stable
            elif [[ "$version" == "$beta" ]]; then
              channel=beta
            fi

            version_digest=$(jq -r --arg version "$version" \
              '.results[] | select(.name == $version) | .digest' <<< "$docker_tags")
            rebuild=false
            if [[ -z "$version_digest" ]]; then
              rebuild=true
            elif [[ "$channel" != version ]]; then
              aliases=()
              [[ "$channel" == stable || "$channel" == stable-beta ]] && aliases+=(latest)
              [[ "$channel" == beta || "$channel" == stable-beta ]] && aliases+=(beta)
              for alias in "${aliases[@]}"; do
                alias_digest=$(jq -r --arg alias "$alias" \
                  '.results[] | select(.name == $alias) | .digest' <<< "$docker_tags")
                [[ "$version_digest" == "$alias_digest" ]] || rebuild=true
              done
            fi

            if [[ "$rebuild" == true ]]; then
              builds=$(jq -c --arg version "$version" --arg channel "$channel" \
                '. + [{version: $version, channel: $channel}]' <<< "$builds")
            fi

            # An existing image proves that its build completed. Repair or
            # create the matching tag/Release without rebuilding it.
            if [[ -n "$version_digest" ]]; then
              IMAGE_DIGEST="$version_digest" \
                scripts/sync-github-release.sh "$version" "$channel" "$GITHUB_SHA"
            fi
          done

          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          {
            echo '# FacturaScripts release discovery'
            echo "- Stable: ${stable}"
            echo "- Beta: ${beta}"
            echo "- Builds queued: $(jq -r 'if length == 0 then "none" else map(.version + " (" + .channel + ")") | join(", ") end' <<< "$builds")"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: discover
    if: needs.discover.outputs.builds != '[]'
    permissions:
      contents: write
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        release: ${{ fromJson(needs.discover.outputs.builds) }}
    uses: ./.github/workflows/build.yml
    with:
      fs_version: ${{ matrix.release.version }}
      fs_channel: ${{ matrix.release.channel }}
    secrets: inherit
