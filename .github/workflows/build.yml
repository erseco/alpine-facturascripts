name: buildx

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      fs_version:
        description: 'FacturaScripts version'
        required: true
      fs_channel:
        description: 'Tags to update in addition to the version'
        required: true
        default: version
        type: choice
        options:
          - version
          - stable
          - beta
          - stable-beta
  workflow_call:
    inputs:
      fs_version:
        description: 'FacturaScripts version tag'
        required: true
        type: string
      fs_channel:
        description: 'Release channel: version, stable, beta or stable-beta'
        required: false
        default: version
        type: string

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - name: Checkout
        uses: actions/checkout@v7

      # Step 2: Determine the exact upstream build and its Docker aliases.
      # A reusable workflow keeps the caller ref (usually main), so metadata
      # cannot infer the FacturaScripts version from github.ref.
      - name: Determine FacturaScripts version
        id: fs_version
        env:
          INPUT_VERSION: ${{ inputs.fs_version }}
          INPUT_CHANNEL: ${{ inputs.fs_channel }}
        run: |
          version="${INPUT_VERSION#v}"
          channel="${INPUT_CHANNEL:-version}"

          if [[ -z "$version" && "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          elif [[ -z "$version" ]]; then
            version="stable"
            channel="main"
          fi

          [[ "$version" =~ ^[0-9]{4}(\.[0-9]+)?$|^stable$|^beta$ ]] || {
            echo "Invalid FacturaScripts version: $version" >&2
            exit 1
          }
          [[ "$channel" =~ ^(version|stable|beta|stable-beta|main)$ ]] || {
            echo "Invalid release channel: $channel" >&2
            exit 1
          }

          {
            echo "version=$version"
            echo "publish_version=$([[ "$version" =~ ^[0-9] ]] && echo true || echo false)"
            echo "stable=$([[ "$channel" == stable || "$channel" == stable-beta ]] && echo true || echo false)"
            echo "beta=$([[ "$channel" == beta || "$channel" == stable-beta ]] && echo true || echo false)"
            echo "main=$([[ "$channel" == main ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      # Step 3: Extract metadata for Docker
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ github.repository }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.fs_version.outputs.version }},enable=${{ steps.fs_version.outputs.publish_version }}
            type=raw,value=latest,enable=${{ steps.fs_version.outputs.stable }}
            type=raw,value=beta,enable=${{ steps.fs_version.outputs.beta }}
            type=raw,value=main,enable=${{ steps.fs_version.outputs.main }}

      # Step 3: Set up QEMU for multi-platform builds
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      # Step 4: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host

      # Step 5: Login to DockerHub and GHCR
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Lint Dockerfile
      - name: Hadolint Action
        uses: hadolint/hadolint-action@v3.3.0
        with:
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint-dockerfile

      # Step 8: Test build (for PRs)
      - name: Debug Build on PR
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --load --build-arg "FS_VERSION=${{ steps.fs_version.outputs.version }}" .

      # Step 9: Test the built image
      - name: Test
        env:
          FS_VERSION: ${{ steps.fs_version.outputs.version }}
        run: |
          docker compose version
          docker compose --file docker-compose.test.yml up --exit-code-from sut --timeout 10 --build

      # Step 10: Build and Push to both registries in a single step
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/s390x
          build-args: |
            FS_VERSION=${{ steps.fs_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 11: Run Trivy vulnerability scanner
      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.fs_version.outputs.publish_version == 'true' && steps.fs_version.outputs.version || 'main' }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Step 12: Update Docker Hub Description
      - name: Docker Hub Description
        if: startsWith(github.ref, 'refs/tags/')
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          short-description: ${{ github.event.repository.description }}
